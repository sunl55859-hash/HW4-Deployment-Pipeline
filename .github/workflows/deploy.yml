
name: HW4 Deployment Pipeline
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: bun test

      - name: Build application
        run: bun run build


      - name: Create build archive
        run: zip -r build.zip dist action.yml README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'BUILD_TAG: %s\nRELEASE_NOTE: %s\n' "$TAG" "$NOTE" > notes.md
          gh release create "$TAG" build.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
            
  
  # Stage 3: Deploy Staging
  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'BUILD_TAG: %s\nRELEASE_NOTE: %s\n' "$TAG" "$NOTE" > notes.md
          gh release create "$TAG" build.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
  
  # Stage 4: AI Release Notes Agent
  release-notes-agent:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: ai-review
    permissions:
      contents: read
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Collect commit history
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'prod-*' --sort=-v:refname | head -n 1)

          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG"..HEAD -n 30 --format='%h %s' > commits.txt
          else
            git log -n 30 --format='%h %s' > commits.txt
          fi

          if [ ! -s commits.txt ]; then
            echo "No new commits found." > commits.txt
          fi

      - name: Generate AI release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat prompts/agent-prompt.md > request.txt
          printf '\nUntrusted commit data follows:\n' >> request.txt
          cat commits.txt >> request.txt

          copilot -p "$(cat request.txt)" \
            -s \
            --no-ask-user \
            --deny-tool='shell,write' \
            > ai-release-notes.md

          test -s ai-release-notes.md

      - name: Upload AI release notes
        uses: actions/upload-artifact@v4
        with:
          name: ai-release-notes
          path: ai-release-notes.md

  # Stage 5: Deploy Production
  deploy-production:
    needs: release-notes-agent
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'BUILD_TAG: %s\nRELEASE_NOTE: %s\n' "$TAG" "$NOTE" > notes.md
          gh release create "$TAG" build.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
