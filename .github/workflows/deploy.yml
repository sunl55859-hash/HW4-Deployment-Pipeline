
name: HW4 Deployment Pipeline
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Create build archive
        run: zip -r build.zip dist action.yml README.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'BUILD_TAG: %s\nRELEASE_NOTE: %s\n' "$TAG" "$NOTE" > notes.md
          gh release create "$TAG" build.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
            
  
  # Stage 3: Deploy Staging
  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'BUILD_TAG: %s\nRELEASE_NOTE: %s\n' "$TAG" "$NOTE" > notes.md
          gh release create "$TAG" build.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --prerelease

  # Stage 4: Deploy Production
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          printf 'BUILD_TAG: %s\nRELEASE_NOTE: %s\n' "$TAG" "$NOTE" > notes.md
          gh release create "$TAG" build.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
